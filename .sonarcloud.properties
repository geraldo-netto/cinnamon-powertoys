# Automatic analysis cannot distinguish Cinnamon's CJS test harness from
# production JavaScript, and its web CSS parser does not understand Cinnamon's
# St/Clutter properties and pseudo-classes. Keep those deliberate dialects out
# of the issue feed while retaining analysis of install and policy tooling.
sonar.exclusions=tests/**,tools/loader.js,tools/scan.js,tools/mutate.js,files/cinnamon-powertoys@geraldo-netto/stylesheet.css
