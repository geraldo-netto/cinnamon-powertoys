# Everything `make check` does, on every push and every pull request.
#
# The runner has no Cinnamon, no session bus and no /sys worth reading, which
# is exactly why the applet's libraries take their file root, their D-Bus
# calls and their spawns as parameters: the tests run against fixtures and
# stubs, so none of that is needed here.

name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# This job reads the repository and writes nothing back to it - no release, no
# comment, no pushed tag - so its token is given the one scope it uses. Stated
# here rather than left to the repository default, which is a setting outside
# this file and can be more than that.
permissions:
  contents: read

# A push that supersedes an earlier one on the same branch makes that earlier
# run's answer worthless before it finishes, so it is cancelled rather than
# left holding a runner. Grouped by workflow and ref: two branches, and a pull
# request and the branch it comes from, are separate questions and never
# cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job is minutes of work. Left unset it would inherit the
    # six-hour default, which is what a hung apt mirror, a wedged cjs process
    # or a step waiting on input actually consumes before anyone notices.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # cjs is Cinnamon's JavaScript interpreter and is what the parse check
      # and the tests are run with, so that they fail here for the same
      # reasons they would fail in the shell.
      #
      # The typelib matters as much as the interpreter. Modules that consume
      # UPower device data or enums open with `imports.gi.UPowerGlib`, which is
      # a runtime lookup and not a dependency anything declares, so without
      # gir1.2-upowerglib-1.0 they fail at load before their tests can run. Gio
      # and GLib arrive with cjs; UPowerGlib is the only one that does not.
      - name: Install cjs, its UPower typelib and gettext
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cjs gir1.2-upowerglib-1.0 gettext

      - name: Check
        timeout-minutes: 10
        run: make check

      - name: Coverage
        id: coverage
        timeout-minutes: 15
        run: make coverage

      # Keep the measured sources, LCOV data, test output and per-function
      # report together when the gate fails. The directory is hidden, so it
      # must be opted in explicitly or the action uploads an empty artifact.
      - name: Preserve coverage failure report
        if: failure() && steps.coverage.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # A staged lifecycle, so packaging and every destructive counterpart are
      # exercised without any of it reaching the runner's own home directory.
      - name: Staged install and uninstall
        timeout-minutes: 10
        run: |
          stage="$PWD/staged"
          data="$stage$HOME/.local/share"
          applet="$data/cinnamon/applets/cinnamon-powertoys@geraldo-netto"
          action="$stage/usr/share/polkit-1/actions/io.github.geraldo-netto.cinnamon-powertoys.policy"
          helper="$stage/usr/local/lib/cinnamon-powertoys/powertoys-helper"
          rapl="$stage/etc/udev/rules.d/99-cinnamon-powertoys-rapl.rules"

          make install DESTDIR="$stage"
          test -f "$applet/applet.js"
          make install-policy DESTDIR="$stage"
          test -f "$action"
          test -x "$helper"
          make install-rapl DESTDIR="$stage"
          test -f "$rapl"

          # Each target shares its parent with other packages. Sentinels make
          # over-broad cleanup fail this smoke test instead of passing because
          # the intended file happened to disappear too.
          mkdir -p "$data/cinnamon/applets/unrelated@example" \
            "$data/locale/fr/LC_MESSAGES" \
            "$stage/usr/share/polkit-1/actions" \
            "$stage/usr/local/lib/cinnamon-powertoys" \
            "$stage/etc/udev/rules.d"
          touch "$data/cinnamon/applets/unrelated@example/keep" \
            "$data/locale/fr/LC_MESSAGES/unrelated.mo" \
            "$stage/usr/share/polkit-1/actions/unrelated.policy" \
            "$stage/usr/local/lib/cinnamon-powertoys/unrelated-helper" \
            "$stage/etc/udev/rules.d/98-unrelated.rules"

          make uninstall DESTDIR="$stage"
          test ! -e "$applet"
          test -f "$data/cinnamon/applets/unrelated@example/keep"
          test -f "$data/locale/fr/LC_MESSAGES/unrelated.mo"

          make uninstall-policy DESTDIR="$stage"
          test ! -e "$action"
          test ! -e "$helper"
          test -f "$stage/usr/share/polkit-1/actions/unrelated.policy"
          test -f "$stage/usr/local/lib/cinnamon-powertoys/unrelated-helper"

          make uninstall-rapl DESTDIR="$stage"
          test ! -e "$rapl"
          test -f "$stage/etc/udev/rules.d/98-unrelated.rules"

      # The template has to match the strings that are actually in the source,
      # or a translator is working from a list that has moved on without them.
      # This can be a diff at all because `make pot` strips the creation stamp -
      # see the Makefile - so a template regenerated over unchanged sources
      # does not differ merely for having been generated later.
      #
      # It is a diff of the strings and not of the file, because a .pot also
      # records where each string was found, and `#: applet.js:975` is a fact
      # about the current line numbering rather than about the string. Any
      # commit that inserts a line above a translatable one rewrites those
      # references and moves the entries, which the file diff read as the
      # template being out of date - so this step failed on refactors that
      # changed no string at all, and the way to a green run was to regenerate
      # a file whose strings were already right. A check that fires on
      # unrelated work is a check people learn to route around.
      #
      # So both sides go through `msgcat --no-location --sort-output` first,
      # which drops the line references and puts the entries in a fixed order.
      # What survives is the msgids, their plurals and flags, and the extracted
      # `#.` comments that tell a translator what a string is for - which is
      # the whole of what this step exists to hold. A string added, removed or
      # reworded still fails it; a line number moving no longer does.
      #
      # The extractor is one standalone Python script, and it ships in the
      # `cinnamon` package - the whole desktop, which is not a thing to install
      # on a runner to read some strings. So it is fetched.
      #
      # Fetched from a commit, and checked against the hash of what that commit
      # holds, because this script is downloaded and then run as root on a
      # machine holding a checkout of this repository. It was pinned to the tag
      # 6.6.9, which is the right thing to read in a changelog and the wrong
      # thing to trust: a tag is a name for a commit and can be moved to name a
      # different one. The commit below is that tag as it stood, and the hash
      # is what makes the pin worth having - a raw URL is served by a host, and
      # the pin alone says which bytes were asked for, not which arrived.
      #
      # To move to a newer Cinnamon: resolve the tag to its commit, fetch the
      # file, sha256sum it, and put both here. `make pot` has to produce the
      # same template afterwards or the check below says so, which is the
      # point of it.
      #
      # Nothing here is allowed to skip itself quietly. The step this replaced
      # asked `command -v` and printed "not available, skipping" when it was
      # not, which it never was, so the check reported success for months
      # without once running.
      - name: Translation template is current
        timeout-minutes: 10
        env:
          # linuxmint/cinnamon, the commit tag 6.6.9 named when this was pinned
          MAKEPOT_COMMIT: 806c1a4e8cd23e528d3446b9e3cf5a3c7a3ddf18
          MAKEPOT_SHA256: 09f3ab35ad02e9ed3a164231fb12aaf64635a558b7bacfd9812f810177220486
        run: |
          sudo apt-get install --no-install-recommends -y python3-polib python3-tz
          curl --proto '=https' --proto-redir '=https' -fsSL -o makepot.py \
            "https://raw.githubusercontent.com/linuxmint/cinnamon/$MAKEPOT_COMMIT/files/usr/bin/cinnamon-xlet-makepot"
          echo "$MAKEPOT_SHA256  makepot.py" | sha256sum -c -
          sudo install -m 0755 makepot.py /usr/local/bin/cinnamon-xlet-makepot
          rm -f makepot.py

          pot=files/cinnamon-powertoys@geraldo-netto/po/cinnamon-powertoys@geraldo-netto.pot
          test -f "$pot" || { echo "no template at $pot"; exit 1; }

          # Kept aside before `make pot` writes over it, so the comparison is
          # against what the tree ships and not against the regenerated file.
          # Outside the checkout, so nothing here leaves a file behind in it.
          cp "$pot" "$RUNNER_TEMP/committed.pot"
          make pot
          msgcat --no-location --sort-output "$RUNNER_TEMP/committed.pot" \
            > "$RUNNER_TEMP/committed.strings"
          msgcat --no-location --sort-output "$pot" \
            > "$RUNNER_TEMP/current.strings"

          diff -u "$RUNNER_TEMP/committed.strings" "$RUNNER_TEMP/current.strings" \
            || { echo "run 'make pot' and commit the result"; exit 1; }
