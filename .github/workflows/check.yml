# Everything `make check` does, on every push and every pull request.
#
# The runner has no Cinnamon, no session bus and no /sys worth reading, which
# is exactly why the applet's libraries take their file root, their D-Bus
# calls and their spawns as parameters: the tests run against fixtures and
# stubs, so none of that is needed here.

name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # cjs is Cinnamon's JavaScript interpreter and is what the parse check
      # and the tests are run with, so that they fail here for the same
      # reasons they would fail in the shell.
      #
      # The typelib matters as much as the interpreter. Four libraries open
      # with `imports.gi.UPowerGlib`, which is a runtime lookup and not a
      # dependency anything declares, so without gir1.2-upowerglib-1.0 they
      # throw at load and take eleven cases down with them - which is what this
      # job did on every run from the day it was added until it was noticed.
      # Gio and GLib arrive with cjs; UPowerGlib is the only one that does not.
      - name: Install cjs, its UPower typelib and gettext
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cjs gir1.2-upowerglib-1.0 gettext

      - name: Check
        run: make check

      # A staged install, so the packaging is exercised without any of it
      # reaching the runner's own home directory.
      - name: Staged install
        run: |
          make install DESTDIR="$PWD/staged"
          test -f "staged$HOME/.local/share/cinnamon/applets/cinnamon-powertoys@geraldo-netto/applet.js"
          make install-policy DESTDIR="$PWD/staged"
          test -f "$PWD/staged/usr/share/polkit-1/actions/io.github.geraldo-netto.cinnamon-powertoys.policy"
          test -x "$PWD/staged/usr/local/lib/cinnamon-powertoys/powertoys-helper"

      # The template has to match the strings that are actually in the source,
      # or a translator is working from a list that has moved on without them.
      # This can only be a diff because `make pot` strips the creation stamp -
      # see the Makefile - so a template regenerated over unchanged sources is
      # byte for byte the one in the tree.
      #
      # The extractor is one standalone Python script, and it ships in the
      # `cinnamon` package - the whole desktop, which is not a thing to install
      # on a runner to read some strings. So it is fetched, from a tag rather
      # than from a branch: an upstream change to the extractor should be
      # something this repository picks up on purpose.
      #
      # Nothing here is allowed to skip itself quietly. The step this replaced
      # asked `command -v` and printed "not available, skipping" when it was
      # not, which it never was, so the check reported success for months
      # without once running.
      - name: Translation template is current
        env:
          MAKEPOT: https://raw.githubusercontent.com/linuxmint/cinnamon/6.6.9/files/usr/bin/cinnamon-xlet-makepot
        run: |
          sudo apt-get install --no-install-recommends -y python3-polib python3-tz
          sudo curl -fsSL -o /usr/local/bin/cinnamon-xlet-makepot "$MAKEPOT"
          sudo chmod +x /usr/local/bin/cinnamon-xlet-makepot
          make pot
          git diff --exit-code -- cinnamon-powertoys@geraldo-netto/po \
            || { echo "run 'make pot' and commit the result"; exit 1; }
